[project]
name = "broken-arrow-hair-curves-studio"
version = "1.0.0"
description = "Complete desktop application for creating and customizing hairstyles using Hair Curves"
authors = [{name = "Broken Arrow Software"}]
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.1",
    "moderngl>=5.10.0",
    "PyOpenGL>=3.1.7",
    "numpy>=1.26.3",
    "scipy>=1.11.4",
    "Pillow>=10.3.0",
    "pygltflib>=1.16.1",
    "trimesh>=4.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
]
build = [
    "pyinstaller>=6.3.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
hair-curves-studio = "hair_curves_studio.app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hair_curves_studio*"]

[tool.pytest.ini_options]
testpaths = ["hair_curves_studio/tests"]
python_files = ["test_*.py"]
